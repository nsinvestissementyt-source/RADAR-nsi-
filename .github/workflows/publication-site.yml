name: Publication du site

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: ["Radar NSI – calcul du lundi", "Radar NSI – scan mensuel des 835 fonds"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@v4
