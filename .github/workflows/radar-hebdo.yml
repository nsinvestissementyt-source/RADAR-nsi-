name: Radar NSI – calcul du lundi

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcul du radar
        run: python radar/calcul.py
      - name: Points d'entrée de tous les fonds classés
        run: python radar/entrees.py
        continue-on-error: true
      - name: Publication
        run: |
          git config user.name "Radar NSI"
          git config user.email "radar-nsi@users.noreply.github.com"
          git add web/radar.json web/macro_cache.json
          if [ -f web/entrees.json ]; then git add web/entrees.json; fi
          git diff --cached --quiet && echo "Aucun changement." && exit 0
          git commit -m "Radar du $(date +%d/%m/%Y)"
          git pull --rebase
          git push
